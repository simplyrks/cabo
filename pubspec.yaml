name: cabo
description: Cabo - A multiplayer card game built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  web_socket_channel: ^3.0.1
  uuid: ^4.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  cabo_shared:
    path: shared

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/suits/
