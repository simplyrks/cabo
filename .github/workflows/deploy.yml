name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Deploy Dart server to Railway ──────────────────────────────────────────
  # Railway watches your GitHub repo directly and redeploys on every push.
  # No extra step needed here — Railway handles it automatically.

  # ── Build Flutter web + deploy to Netlify ──────────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --output=build/web

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: build/web
          production-branch: main
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
